<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Got It · QR Voucher Payment Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Exo+2:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --red:#E8212B; --red-dark:#C9161F; --grad:linear-gradient(90deg,#FF6167,#E8212B);
    --ink:#241B1B; --muted:#8C8C8C; --line:#EEEEEE; --green:#12A150; --amber:#B26A00;
    --panel:#171B22; --panel-2:#1F242D;
    --font:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --disp:"Exo 2","Barlow",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:28px 20px 20px;font-family:var(--font);
    background:radial-gradient(1200px 700px at 50% -10%,#1C222B,#0E1116 60%);color:#E7EAF0;min-height:100vh}
  h1,h2,h3,h4,p{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  svg{display:block}
  img{display:block}

  .head{max-width:1180px;margin:0 auto 22px;text-align:center}
  .head h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);
    border:1px solid #262C36;font-size:13.5px;font-weight:500;color:#8892A0;transition:.25s}
  .step b{width:19px;height:19px;border-radius:50%;background:#2A313C;color:#98A1AE;display:grid;place-items:center;
    font-size:11px;font-weight:700;transition:.25s}
  .step.on{background:rgba(232,33,43,.13);border-color:rgba(232,33,43,.5);color:#FFCFCC}
  .step.on b{background:var(--red);color:#fff}
  .step.done{color:#6FCF97;border-color:rgba(18,161,80,.35)}
  .step.done b{background:var(--green);color:#fff}

  .stage{max-width:880px;margin:28px auto 0;display:grid;grid-template-columns:380px 412px;gap:56px;justify-content:center;align-items:center}
  @media(max-width:900px){.stage{grid-template-columns:1fr;max-width:420px;gap:28px}
    .stage>.col-pos{order:2}.stage>.col-phone{order:1}}
  .dev-label{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#6E7887;margin-bottom:12px;text-align:center}
  .bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
  .scen{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid #262C36;flex-wrap:wrap;justify-content:center}
  .scen button{padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:#98A1AE;transition:.18s}
  .scen button:hover{color:#fff}
  .scen button.on{background:#2A313C;color:#fff}
  .reset{width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid #262C36;color:#98A1AE;font-size:17px}
  .reset:hover{color:#fff;border-color:#3C4553}

  /* ================= CASHIER · POS ================= */
  .pos{background:linear-gradient(180deg,#12161C,#0B0E13);border:1px solid #2A313C;border-radius:14px;padding:18px;text-align:center}
  .pos-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .pos-logo{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:#C9D2DF}
  .pos-logo i{width:22px;height:22px;border-radius:6px;background:#2F80ED;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff}
  .pos-status{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:#2A313C;color:#98A1AE}
  .pos-status.wait{background:rgba(245,165,36,.15);color:#F5A524}
  .pos-status.live{background:rgba(47,128,237,.16);color:#68A8F5}
  .pos-status.ok{background:rgba(18,161,80,.16);color:#4ADE80}
  .pos-amount{font-size:32px;font-weight:800;letter-spacing:-.01em;color:#fff}
  .pos-order{font-size:12px;color:#6E7887;margin-bottom:16px}
  .qrbox{background:#fff;border-radius:12px;padding:12px;display:inline-block;position:relative}
  .qrbox .qrlogo{position:absolute;inset:0;margin:auto;width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
  .qrlogo span{width:28px;height:28px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:8.5px;font-weight:800;line-height:1.05}
  .qr-hint{font-size:12px;color:#6E7887;margin-top:12px;line-height:1.5}
  .pos-done{padding:26px 8px}
  .pos-done .tick{width:52px;height:52px;border-radius:50%;background:rgba(18,161,80,.15);color:#4ADE80;display:grid;place-items:center;margin:0 auto 12px;font-size:26px}
  .pos-done h4{font-size:16px;font-weight:700;color:#fff}
  .pos-done p{font-size:12.5px;color:#7E8896;margin-top:6px}
  .pos-line{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px dashed #2A313C;color:#9AA4B2}
  .pos-line b{color:#fff;font-weight:600}

  .chan{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid #262C36}
  .chan button{padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:#98A1AE;display:flex;align-items:center;gap:7px;transition:.18s}
  .chan button:hover{color:#fff}
  .chan button.on{background:var(--red);color:#fff}
  .chan em{font-style:normal;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;background:rgba(18,161,80,.2);color:#4ADE80}
  .chan button.on em{background:rgba(255,255,255,.22);color:#fff}
  @media(max-width:900px){.stage.portal>.col-pos{order:1}.stage.portal>.col-phone{order:2}}
  .pos-btn{margin-top:14px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;background:var(--red);color:#fff}
  .pos-btn.ghost{background:transparent;border:1px solid #2A313C;color:#98A1AE}
  .pos-btn.ghost:hover{color:#fff;border-color:#3C4553}

  .cart{text-align:left;border-top:1px dashed #2A313C}
  .cart-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px dashed #2A313C;color:#C9D2DF}
  .cart-row small{display:block;color:#6E7887;font-size:11.5px;margin-top:1px}
  .cart-row b{color:#fff;font-weight:600;white-space:nowrap}
  .pos-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px;font-size:13.5px;color:#9AA4B2}
  .pos-total b{font-size:25px;font-weight:800;color:#fff;letter-spacing:-.01em}
  .pos-btn.wide{display:block;width:100%;height:44px;font-size:14.5px;font-weight:700}
  .paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .pay{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border-radius:12px;background:#1F242D;border:1px solid #2A313C;font-size:12.5px;font-weight:600;color:#9AA4B2}
  .pay.dis{opacity:.45;cursor:not-allowed}
  .pay.gotit{border-color:rgba(232,33,43,.6);background:rgba(232,33,43,.12);color:#FFCFCC;box-shadow:0 0 0 3px rgba(232,33,43,.12)}
  .pay.gotit:hover{background:rgba(232,33,43,.22)}
  .pay .pi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#2A313C}
  .pay.gotit .pi{background:var(--red);color:#fff;font-size:8.5px;font-weight:800;line-height:1.05}

  /* ================= CASHIER · GOT IT PORTAL ================= */
  .browser{background:#fff;border-radius:12px;overflow:hidden;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .br-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#E4E7EC}
  .br-bar>i{width:9px;height:9px;border-radius:50%;background:#FF5F57;flex:none}
  .br-bar>i:nth-child(2){background:#FEBC2E}
  .br-bar>i:nth-child(3){background:#28C840}
  .br-url{flex:1;min-width:0;margin-left:6px;background:#fff;border-radius:6px;font-size:11.5px;color:#5A616B;padding:4px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-head{background:#F25C54;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
  .wp-head b{font-size:14px;font-weight:800}
  .wp-head span{font-size:11px;font-weight:600;opacity:.92}
  .wp-store{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .wp-store .mlogo{width:38px;height:38px;border-radius:9px}
  .wp-store .mlogo img{width:32px}
  .wp-store .nm{font-size:14px;font-weight:700}
  .wp-store .ad{font-size:11.5px;color:var(--muted);margin-top:1px}
  .wp-tabs{display:flex;gap:3px;margin:12px 14px 0;background:#F2F3F5;border-radius:10px;padding:3px}
  .wp-tabs button{flex:1;font-size:12.5px;font-weight:700;padding:7px 4px;border-radius:8px;color:#6B7280}
  .wp-tabs button.on{background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .wp-body{padding:14px}
  .wp-title{font-size:16px;font-weight:800;text-align:center;margin:2px 0 4px}
  .wp-label{font-size:12.5px;font-weight:700;color:#4A505A;margin:12px 0 6px;display:flex;justify-content:space-between}
  .wp-body>.wp-label:first-child{margin-top:0}
  .wp-label button{font-size:12px;font-weight:700;color:var(--red)}
  .wp-amt-in{height:46px;border:1.5px solid var(--red);border-radius:10px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .wp-amt-in.empty{color:#B8BDC5}
  .wp-text{width:100%;height:40px;border:1.5px solid #E4E6EA;border-radius:10px;padding:0 12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);outline:none;background:#fff}
  .wp-text:focus{border-color:#9AA0A8}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
  .keypad button{height:40px;font-size:16px;font-weight:700;color:#2C3138;background:#FAFAFB;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .keypad button:nth-child(3n){border-right:none}
  .keypad button:nth-last-child(-n+3){border-bottom:none}
  .keypad button:active{background:#ECEEF1}
  .wp-btn{display:block;width:100%;height:44px;border-radius:10px;background:var(--red);color:#fff;font-size:14.5px;font-weight:700;margin-top:14px}
  .wp-btn:active{background:var(--red-dark)}
  .wp-btn.ghost{background:#fff;border:1.5px solid #E4E6EA;color:#4A505A;height:40px;margin-top:8px;font-size:13.5px}
  .wp-btn[disabled]{background:#E4E6EA;color:#A6ABB3;border-color:#E4E6EA;cursor:not-allowed}
  .wp-center{text-align:center}
  .wp-big{font-size:29px;font-weight:800;letter-spacing:-.01em;margin-top:12px}
  .wp-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .wp-qr{display:inline-block;border:1px solid var(--line);border-radius:12px;margin:12px 0 2px}
  .wp-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-top:1px dashed #E2E4E8;color:#5A616B}
  .wp-line b{color:var(--ink)}
  .wp-collect{margin-top:10px;border-radius:10px;padding:11px 12px;font-size:13px;line-height:1.5;background:#FFF8E6;border:1px solid #F7E2A8;color:#7A5A00}
  .wp-collect.ok{background:#E9F7EF;border-color:#BFE5CE;color:#0B6B36}
  .wp-collect b{font-size:16px}
  .wp-tick{width:48px;height:48px;border-radius:50%;background:#E9F7EF;color:var(--green);display:grid;place-items:center;font-size:24px;font-weight:700;margin:4px auto 10px}
  .wp-tick.bad{background:#FDECEB;color:var(--red)}
  .browser .pos-status{background:#F1F2F4;color:#6B7280}
  .browser .pos-status.wait{background:#FFF3E0;color:var(--amber)}
  .browser .pos-status.live{background:#E8F1FD;color:#1F6FD1}

  /* ================= PHONE · Got It app (EN) ================= */
  .col-phone{display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone{width:412px;height:846px;background:#000;border-radius:54px;padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px #333;position:relative;flex:none}
  @media(max-width:430px){.phone{width:100%;height:800px;border-radius:42px}}
  .screen{width:100%;height:100%;background:#fff;border-radius:44px;overflow:hidden;position:relative;color:var(--ink);display:flex;flex-direction:column}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:118px;height:30px;background:#000;border-radius:999px;z-index:60}

  .sbar{display:flex;justify-content:space-between;align-items:center;padding:17px 30px 4px;flex:none;z-index:50;position:relative}
  .sbar .t{font-size:16.5px;font-weight:600;letter-spacing:.01em}
  .sbar .r{display:flex;align-items:center;gap:6px}
  .sbar.dark .t,.sbar.dark .r{color:#fff}
  .batt{width:27px;height:15px;border-radius:5px;background:#111;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
  .sbar.dark .batt{background:#fff;color:#111}
  .camdot{width:9px;height:9px;border-radius:50%;background:#31D158;position:absolute;top:22px;left:50%;transform:translateX(48px);z-index:61}

  .view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
  .view::-webkit-scrollbar{width:0}

  /* ---- Home ---- */
  .balance{padding:8px 22px 0;display:flex;justify-content:space-between;align-items:flex-start}
  .balance .amt{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.2}
  .balance .sub{font-size:17px;margin-top:3px}
  .balance .sub b{font-weight:700;margin-right:4px}
  .mascot{width:60px;margin:-2px 10px 0 0}
  .searchrow{display:flex;gap:11px;padding:16px 22px 0;align-items:center}
  .search{flex:1;min-width:0;height:46px;border:1.5px solid #E8E8E8;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#8E8E8E;font-size:15.5px}
  .search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bell{width:46px;height:46px;border:1.5px solid #E8E8E8;border-radius:12px;display:grid;place-items:center;position:relative;flex:none}
  .bell em{position:absolute;top:-8px;right:-7px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:600;padding:2px 6px;border-radius:999px}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);padding:20px 12px 0;text-align:center}
  .quick .q{font-size:14px;font-weight:600;line-height:1.3}
  .quick .q .ic{height:44px;display:grid;place-items:center;margin-bottom:8px}
  .banner{width:calc(100% - 44px);margin:20px 22px 0;border-radius:12px}
  .sec-title{font-size:21px;font-weight:700;padding:24px 22px 12px;letter-spacing:-.01em}
  .brandrow{display:flex;gap:9px;padding:0 22px;overflow-x:auto}
  .brandrow::-webkit-scrollbar{height:0}
  .bcard{flex:none;width:79px;background:#F6F6F7;border-radius:14px;padding:4px 4px 9px;text-align:center}
  .bcard img{width:71px;height:71px;border-radius:11px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08)}
  .bcard span{display:block;font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
  .brandrow.recent{padding-bottom:22px}
  .brandrow.recent .bcard{width:100px;background:#fff;border:1px solid #ECECEC;padding:12px 6px 10px}
  .brandrow.recent .bcard img{width:52px;height:52px;margin:0 auto;box-shadow:none;border-radius:8px}

  .nav{display:flex;border-top:1px solid #EFEFF1;background:#fff;padding:9px 0 24px;flex:none;z-index:40}
  .nav button{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:500;color:#6E6E6E;white-space:nowrap}
  .nav button .ic{height:28px;display:grid;place-items:center;margin-bottom:3px}
  .nav button.on{color:var(--red)}

  /* ---- Scanner ---- */
  .scanner{position:absolute;inset:0;background:#15181D;z-index:70;display:flex;flex-direction:column;color:#fff}
  .cam{position:absolute;inset:0;background:linear-gradient(112deg,#575D66,#2A2E35 50%,#464B54);overflow:hidden}
  .shade{position:absolute;inset:0;background:rgba(0,0,0,.52)}
  .scan-top{position:relative;display:flex;justify-content:space-between;padding:52px 30px 0;z-index:3}
  .scan-title{position:relative;text-align:center;font-size:18px;font-weight:500;margin-top:36px;z-index:3;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .framewrap{position:relative;z-index:3;margin-top:24px;height:264px}
  .corners{position:absolute;left:50%;top:0;transform:translateX(-50%);width:290px;height:264px;pointer-events:none}
  .corners i{position:absolute;width:44px;height:44px;border:5px solid #F2F2F2}
  .corners i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
  .corners i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
  .corners i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
  .corners i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
  .target{position:absolute;left:50%;top:0;transform:translateX(-50%);width:264px;height:264px;border-radius:20px;
    overflow:hidden;cursor:pointer;transition:transform .16s}
  .target:active{transform:translateX(-50%) scale(.97)}
  .scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:sl 2.2s ease-in-out infinite;z-index:4}
  @keyframes sl{0%,100%{top:16px}50%{top:246px}}
  .scan-bottom{position:relative;z-index:3;margin-top:auto;display:flex;justify-content:space-around;padding:0 26px 46px;font-size:15px;text-align:center}
  .scan-bottom .ic{height:34px;display:grid;place-items:center;margin-bottom:6px}
  .tablet{position:absolute;inset:0;background:#F4F5F7;display:flex;flex-direction:column;align-items:center}
  .tb-head{align-self:stretch;background:#F25C54;color:#fff;font-size:11.5px;font-weight:800;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px}
  .tb-amt{font-size:19px;font-weight:800;color:#131313;margin:8px 0 6px}
  .tablet .qrbox{box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .tablet.dark{background:linear-gradient(180deg,#12161C,#0B0E13)}
  .tablet.dark .tb-head{background:transparent;color:#C9D2DF;border-bottom:1px solid #2A313C}
  .tablet.dark .tb-head i{width:16px;height:16px;border-radius:4px;background:#2F80ED;display:grid;place-items:center;font-style:normal;font-size:9px;color:#fff}
  .tablet.dark .tb-amt{color:#fff}
  .tb-empty{margin:auto;font-size:14px;color:#8A8F98;font-weight:600}
  .tablet.dark .tb-empty{color:#6E7887}

  /* ---- Pay with vouchers ---- */
  .navbar{display:flex;align-items:center;height:50px;padding:0 16px;position:relative;flex:none;box-shadow:0 5px 12px rgba(0,0,0,.05);z-index:5}
  .navbar h3{position:absolute;left:0;right:0;text-align:center;font-family:var(--disp);font-size:20px;font-weight:700;pointer-events:none}
  .merchant{display:flex;gap:13px;align-items:center;padding:16px 22px 0}
  .mlogo{width:56px;height:56px;border-radius:13px;border:1px solid #EDEDED;box-shadow:0 2px 6px rgba(0,0,0,.06);background:#fff;overflow:hidden;flex:none;display:grid;place-items:center}
  .mlogo img{width:46px}
  .merchant .nm{font-size:20px;font-weight:600}
  .merchant .ad{font-size:14px;color:var(--muted);margin-top:1px}
  .payamt{margin:14px 22px 18px;border-radius:12px;background:linear-gradient(100deg,#FFF4EA,#FDE5E3);padding:12px 16px 13px;text-align:center}
  .payamt .lb{font-size:14.5px}
  .payamt .vl{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1.2;margin-top:2px}
  .payamt .oid{font-size:12.5px;color:#7A6A66;margin-top:2px}
  .vhead{display:flex;justify-content:space-between;align-items:center;padding:0 22px 12px}
  .vhead span{font-size:18px;font-weight:700}
  .vhead button{font-size:14px;font-weight:500;border:1.5px solid var(--ink);border-radius:9px;padding:4px 14px}

  .vt{position:relative;margin:0 22px 12px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.09);display:flex;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s}
  .vt.sel{border-color:#F6A9A9}
  .vt.dis{opacity:.45;cursor:default}
  .vt-l{width:86px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-right:1.5px dashed #E0E0E0;position:relative}
  .vt-l::before,.vt-l::after{content:"";position:absolute;right:-8px;width:15px;height:15px;border-radius:50%;background:#fff}
  .vt-l::before{top:-9px;box-shadow:inset 0 -2px 3px rgba(0,0,0,.08)}
  .vt-l::after{bottom:-9px;box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
  .vt-l img{width:58px;border-radius:4px}
  .vt-l span{font-size:11.5px;margin-top:6px;text-align:center;line-height:1.2}
  .vt-r{flex:1;min-width:0;padding:10px 40px 10px 14px}
  .vt-tag{font-size:12.5px;color:#777}
  .vt-nm{font-size:16px;font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vt-pr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:1px}
  .vt-pr b{font-family:var(--disp);font-size:19px;font-weight:700}
  .vt-use{font-size:13px;font-weight:600;color:var(--green);text-align:right;white-space:nowrap;margin-right:-28px}
  .vt-use.lost{color:var(--amber)}
  .vt-ex{font-size:12.5px;color:#555;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .vt-chk{position:absolute;top:10px;right:10px;width:23px;height:23px;border-radius:50%;border:1.5px solid #D2D2D2;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .vt.sel .vt-chk{background:var(--grad);border-color:transparent}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px}
  .pill.sug{background:#FDE7E7;color:var(--red)}
  .pill.soon{background:#FFF1DC;color:var(--amber)}
  .pill.no{background:#F1F1F1;color:#666}
  .empty-v{margin:0 22px 12px;padding:16px;border:1.5px dashed #E2E2E2;border-radius:12px;font-size:14px;color:var(--muted);text-align:center}

  .warn{margin:2px 22px 12px;background:#FFF6E8;border:1px solid #F7DEB0;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:#7A5200}
  .sum{margin:4px 22px 14px}
  .sumrow{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;color:#555}
  .sumrow b{color:var(--ink);font-weight:600}
  .sumrow .green{color:var(--green);font-weight:600}
  .sumrow .lostc{color:var(--amber);font-weight:600}
  .sumrow.big{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:16.5px;font-weight:700;color:var(--ink)}
  .sumrow.big b{font-family:var(--disp);font-size:21px;font-weight:700;color:var(--red)}
  .cta{padding:12px 22px 26px;border-top:1px solid #F0F0F0;background:#fff;flex:none}
  .btn{width:100%;height:52px;border-radius:10px;background:var(--grad);color:#fff;font-size:18px;font-weight:600;display:grid;place-items:center}
  .btn:active{filter:brightness(.92)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);height:46px;font-size:16px;font-weight:500;margin-top:10px}
  .btn[disabled]{background:#E6E6E6;color:#A8A8A8;cursor:not-allowed}

  /* ---- Confirmation popup ---- */
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:90;display:grid;place-items:center;padding:0 18px;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}}
  .modal-in{position:relative;width:100%;background:#fff;border-radius:18px;padding:24px 20px 20px;animation:pop2 .26s cubic-bezier(.2,1.2,.4,1)}
  @keyframes pop2{from{transform:scale(.9);opacity:0}}
  .m-x{position:absolute;top:16px;right:16px}
  .m-head{text-align:center;padding:0 10px}
  .m-head h3{font-size:26px;font-weight:700}
  .m-head p{font-size:16px;margin-top:8px;line-height:1.45}
  .m-tbl{margin-top:20px}
  .m-tr{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:15px;padding:7px 0}
  .m-tr span:nth-child(n+2){text-align:right;min-width:56px}
  .m-tr.th{color:#A3A3A3;padding-top:0}
  .m-total{display:flex;justify-content:space-between;border-top:1px solid #E6E6E6;margin-top:8px;padding-top:14px;font-size:18px;font-weight:700}
  .m-total b{color:var(--red)}
  .m-row{display:flex;justify-content:space-between;font-size:14px;color:#666;padding:4px 0}
  .m-row b{font-weight:600;color:var(--ink)}
  .m-note{margin-top:12px;background:#FFF6E8;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;color:#7A5200}
  .m-foot{display:flex;gap:14px;margin-top:20px}
  .m-foot button{height:52px;border-radius:9px;font-size:19px;font-weight:500}
  .m-foot .cancel{flex:0 0 42%;border:1.5px solid var(--red);color:var(--red);background:#fff}
  .m-foot .ok{flex:1;background:var(--grad);color:#fff}

  /* ---- Status screens ---- */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center}
  .spin{width:46px;height:46px;border:3.5px solid #F0F0F0;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center h3{font-size:20px;font-weight:700;margin-top:20px}
  .center p{font-size:15px;color:#777;margin-top:8px;line-height:1.5}
  .okmark{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:44px;animation:pop2 .4s cubic-bezier(.2,1.4,.4,1)}
  .badmark{width:84px;height:84px;border-radius:50%;background:#FDE7E7;color:var(--red);display:grid;place-items:center;font-size:40px}
  .paid-amt{font-family:var(--disp);font-size:32px;font-weight:700;margin-top:14px}
  .rcpt{width:100%;margin-top:20px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.09);padding:4px 0;text-align:left;overflow:hidden}
  .rcpt .r{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;font-size:14px;color:#666}
  .rcpt .r b{color:var(--ink);font-weight:600;text-align:right}
  .rcpt .r.foot{background:#F4F4F4;margin-top:4px;margin-bottom:-4px;font-size:13px}
</style>

</head>

function reset(sc){
  const key = sc || S.scenario || 'full', amt = SCENARIOS[key].amount;

       orderId:newOrderId(), billNo:'INV-'+rnd4(), qrN:0, wpTab:'qr',
       screen:'home', picking:false, selected:[], modal:false,
       posState: CH==='portal' ? (AUTH?'create':'login') : 'cart'};
  S.selected = suggest();
  render();
}

  CH=c; history.replaceState(null,'',c==='portal'?'#portal':location.pathname+location.search);
  reset();
}

/* priority: expiring soon → non-splittable (Link V) → earlier expiry */
const rank = v => [soon(v)?0:1, v.split?1:0, toDate(v.exp)];
function byPriority(a,b){ const x=rank(a), y=rank(b); return x[0]-y[0] || x[1]-y[1] || x[2]-y[2]; }

function suggest(){
  const picked=[]; let left=S.amount;
  for(const v of VOUCHERS.filter(applicable).sort(byPriority)){
    if(left<=0) break;
    if(!v.split && v.value-left>OVER_MAX) continue;   // non-splittable and over by more than 20k → skip
    picked.push(v.id); left -= Math.min(v.value,left);
  }
  return picked;
}

/* can this voucher be added? */
function blockReason(v, restBefore){
  if(!applicable(v)) return 'Only at '+v.brandName;
  if(restBefore<=0) return 'Bill already covered';
  if(!v.split && v.value-restBefore>OVER_MAX) return 'Over the amount due by > 20.000đ';
  return null;
}
function restExcluding(id){
  let left = S.amount;
  for(const vid of S.selected){
    if(vid===id) continue;
    left -= Math.min(VOUCHERS.find(x=>x.id===vid).value, Math.max(left,0));
  }
  return Math.max(left,0);
}
function calc(){
  let left=S.amount, applied=[], refund=0, lost=0;
  for(const id of S.selected){
    const v = VOUCHERS.find(x=>x.id===id);
    const use = Math.min(v.value, Math.max(left,0));
    const keep = v.split ? v.value-use : 0, loss = v.split ? 0 : v.value-use;
    applied.push({v, use, keep, lost:loss});
    refund += keep; lost += loss; left -= use;
  }
  const rest = Math.max(left,0);
  return {applied, rest, refund, lost, paid:S.amount-rest};
}

/* ================= QR ================= */
function drawQR(cv,size,seed){
  const N=29, px=Math.floor(size/N), s=px*N;
  cv.width=s; cv.height=s; const c=cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,s,s); c.fillStyle='#0B0E13';
  let r=seed; const rnd=()=>{r=(r*1103515245+12345)&0x7fffffff;return r/0x7fffffff};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if((x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9)) continue;
    if(rnd()>0.52) c.fillRect(x*px,y*px,px,px);
  }
  const f=(ox,oy)=>{c.fillRect(ox*px,oy*px,7*px,7*px);c.fillStyle='#fff';c.fillRect((ox+1)*px,(oy+1)*px,5*px,5*px);
    c.fillStyle='#0B0E13';c.fillRect((ox+2)*px,(oy+2)*px,3*px,3*px)};
  f(0,0); f(N-7,0); f(0,N-7);
}

  </div>`;
}

function scVerify(){
  return sbar(false)+`<div class="center"><div class="spin"></div>
    <h3>Verifying QR code</h3></div>`;
}

function scReview(){
  const k = calc(), sugIds = suggest();
  const tk = (v)=>{
    const on = S.selected.includes(v.id);
    const reason = on ? null : blockReason(v, restExcluding(v.id));
    const a = k.applied.find(x=>x.v.id===v.id), t = thumb(v);
    return `<div class="vt ${on?'sel':''} ${reason?'dis':''}" ${reason?'':`onclick="toggle('${v.id}')"`}>
      <div class="vt-l"><img src="${t.img}" alt=""><span>${t.cap}</span></div>
      <div class="vt-r">
        <div class="vt-tag">${v.split?'Link E · Split for multiple uses':'Link V · Single-use'}</div>
        <div class="vt-nm">${v.name}</div>
        <div class="vt-pr"><b>${money(v.value)}</b>${on&&a?`<span class="vt-use ${a.lost?'lost':''}">${a.lost?`use all · ${money(a.lost)} over`:`use ${money(a.use)}`}</span>`:''}</div>
        <div class="vt-ex">EXP:${v.exp}
          ${S.picking&&sugIds.includes(v.id)&&!reason?'<span class="pill sug">Suggested</span>':''}
          ${soon(v)?'<span class="pill soon">Expiring soon</span>':''}
          ${reason?`<span class="pill no">${reason}</span>`:''}</div>
      </div>
      <div class="vt-chk">${on?'✓':''}</div>
    </div>`;
  };
  const all = [...VOUCHERS.filter(applicable).sort(byPriority), ...VOUCHERS.filter(v=>!applicable(v))];
  const shown = S.picking ? all : S.selected.map(id=>VOUCHERS.find(v=>v.id===id));
  const lostNames = k.applied.filter(a=>a.lost).map(a=>`${a.v.name} ${money(a.v.value)}`).join(', ');
  return sbar(false) + `
  <div class="navbar"><span onclick="go('scan')" style="cursor:pointer">${I.back}</span><h3>Pay with vouchers</h3></div>
  <div class="view">
    <div class="merchant">${mlogo()}
      <div><div class="nm">${MERCHANT.name}</div><div class="ad">${MERCHANT.addr[CH]}</div></div></div>
    <div class="payamt"><div class="lb">Amount to pay</div><div class="vl">${money(S.amount)}</div>
      <div class="oid">${CH==='portal'?`Bill ${S.billNo||'—'}`:`Order ${S.orderId}`} · QR valid for 2:32</div></div>
    <div class="vhead"><span>${S.picking?'All vouchers':'Applied vouchers'} (${S.picking?all.length:S.selected.length})</span>
      <button onclick="togglePick()">${S.picking?'Done':'Change'}</button></div>
    ${shown.map(tk).join('') || '<div class="empty-v">No voucher selected</div>'}
    ${k.lost>0?`<div class="warn">⚠ <b>${lostNames}</b> can't be split — the extra <b>${money(k.lost)}</b> will not be refunded.</div>`:''}
    <div class="sum">
      <div class="sumrow"><span>Order total</span><b>${money(S.amount)}</b></div>
      <div class="sumrow"><span>Paid by vouchers</span><span class="green">−${money(k.paid)}</span></div>
      ${k.refund>0?`<div class="sumrow"><span>Kept in your wallet</span><span>${money(k.refund)}</span></div>`:''}
      ${k.lost>0?`<div class="sumrow"><span>Unused, non-refundable</span><span class="lostc">${money(k.lost)}</span></div>`:''}
      <div class="sumrow big"><span>Pay at counter</span><b>${money(k.rest)}</b></div>
    </div>
  </div>
  <div class="cta"><button class="btn" ${S.selected.length?'':'disabled'} onclick="openModal()">Confirm payment</button></div>
  ${S.modal?modalConfirm():''}`;
}

/* ---- Confirmation popup ---- */
function modalConfirm(){
  const k=calc();
  return `<div class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-in">
      <button class="m-x" onclick="closeModal()">${I.x}</button>
      <div class="m-head">
        <h3>Confirmation</h3>
        <p>Your Got It vouchers will be used for this payment as follows:</p>
      </div>
      <div class="m-tbl">
        <div class="m-tr th"><span>Voucher</span><span>Value</span><span>Use</span></div>
        ${k.applied.map(a=>`<div class="m-tr"><span>${a.v.name}</span><span>${money(a.v.value)}</span><span>${money(a.use)}</span></div>`).join('')}
      </div>
      <div class="m-total"><span>Total amount</span><b>${money(k.paid)}</b></div>
      <div style="margin-top:8px">
        <div class="m-row"><span>Order total</span><b>${money(S.amount)}</b></div>
        ${k.refund>0?`<div class="m-row"><span>Kept in your wallet</span><b style="color:var(--green)">${money(k.refund)}</b></div>`:''}
        ${k.lost>0?`<div class="m-row"><span>Unused, non-refundable</span><b style="color:var(--amber)">${money(k.lost)}</b></div>`:''}
        <div class="m-row"><span>Pay at counter</span><b style="color:${k.rest>0?'var(--red)':'inherit'}">${money(k.rest)}</b></div>
      </div>
      ${k.lost>0?`<div class="m-note">The extra <b>${money(k.lost)}</b> on a single-use voucher will not be refunded.</div>`:''}
      <div class="m-foot">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="ok" onclick="pay()">Confirm</button>
      </div>
    </div>
  </div>`;
}

function scProcessing(){
  return sbar(false)+`<div class="center"><div class="spin"></div>
    <h3>Processing payment</h3></div>`;
}
function scSuccess(){
  const k=calc();
  return sbar(false)+`<div class="center">
    <div class="okmark">✓</div>
    <h3 style="font-size:22px">Payment successful</h3>
    <p>${MERCHANT.name} has received your payment</p>
    <div class="paid-amt">−${money(k.paid)}</div>
    <div class="rcpt">
      <div class="r"><span>Transaction ID</span><b>${S.orderId}</b></div>
      ${CH==='portal'?`<div class="r"><span>Bill no.</span><b>${S.billNo||'—'}</b></div>`:''}
      <div class="r"><span>Vouchers used</span><b>${k.applied.map(a=>a.v.name).join('<br>')}</b></div>
      ${k.refund>0?`<div class="r"><span>Kept in your wallet</span><b style="color:var(--green)">${money(k.refund)}</b></div>`:''}
      ${k.lost>0?`<div class="r"><span>Unused, non-refundable</span><b style="color:var(--amber)">${money(k.lost)}</b></div>`:''}
      ${k.rest>0?`<div class="r"><span>Pay at counter</span><b>${money(k.rest)}</b></div>`:''}
      <div class="r"><span>Remaining balance</span><b>${money(VOUCHERS.reduce((s,v)=>s+v.value,0)-k.paid-k.lost)}</b></div>
      <div class="r foot"><span>Time</span><b>16:02 · ${TODAY}</b></div>
    </div></div>
  <div class="cta"><button class="btn" onclick="go('home')">Back to Home</button>
    <button class="btn ghost">View transaction</button></div>`;
}
function scError(){
  const t = {
    expired:  {i:'⏱',h:'QR code expired',p:'This code is only valid for 3 minutes. Ask the cashier to create a new QR code, then scan again.',b:'Scan again'},
    paid:     {i:'✓',h:'Order already paid',p:`Order ${S.orderId} was paid at 15:51 today. Nothing more was charged.`,b:'View past transaction'},
    cancelled:{i:'✕',h:'Cashier cancelled the QR code',p:'No voucher was charged. To pay with vouchers, ask the cashier for a new code and scan again.',b:'Scan again'},
  }[S.phoneErr];
  return sbar(false)+`<div class="center"><div class="badmark">${t.i}</div>
    <h3 style="font-size:21px">${t.h}</h3><p>${t.p}</p></div>
  <div class="cta"><button class="btn" onclick="go('scan')">${t.b}</button>
    <button class="btn ghost" onclick="go('home')">Back to Home</button></div>`;
}

/* ================= ACTIONS ================= */
function go(s){ S.screen=s; S.modal=false; if(s==='home'&&S.posState==='scanned') S.posState='waiting'; render(); }
function doScan(){
  if(!qrLive()) return;
  S.screen='verify'; S.posState='scanned'; render();
  setTimeout(()=>{
    if(S.screen!=='verify') return;   // cashier cancelled or demo restarted meanwhile
    if(S.err){S.phoneErr=S.err; S.screen='error'; S.posState=S.err==='expired'?'expired':'waiting';}
    else {S.screen='review'; S.picking=false; S.selected=suggest();}
    render();
  },1100);
}
function toggle(id){
  S.selected = S.selected.includes(id) ? S.selected.filter(x=>x!==id) : [...S.selected,id];
  render();
}
function togglePick(){S.picking=!S.picking; render()}
function openModal(){S.modal=true; render()}
function closeModal(){S.modal=false; render()}
function pay(){
  S.modal=false; S.screen='processing'; render();
  setTimeout(()=>{ if(S.screen!=='processing') return; S.screen='success'; S.posState='paid'; render() },1500);
}

/* cashier side */
function login(){ AUTH=true; S.posState='create'; render(); }
function keyIn(k){
  if(k==='clr') S.amtStr='';
  else if(k==='del') S.amtStr=S.amtStr.slice(0,-1);
  else if((S.amtStr+k).length<=10) S.amtStr=(S.amtStr+k).replace(/^0+/,'');
  S.amount=+S.amtStr||0; render();
}
function createQR(){ if(!S.amount) return; S.qrN++; S.posState='waiting'; S.selected=suggest(); render(); }
function renewQR(){ S.err=null; S.qrN++; S.posState='waiting'; render(); }
function cancelQR(){
  if(S.screen==='processing') return;
  S.posState = CH==='portal' ? 'create' : 'method';
  if(S.screen==='verify'||S.screen==='review'){ S.screen='error'; S.phoneErr='cancelled'; S.modal=false; S.picking=false; }
  render();
}
function newOrder(){
  S.orderId=newOrderId(); S.billNo='INV-'+rnd4(); S.qrN++;
  S.err=null; S.selected=[]; S.picking=false; S.modal=false; S.screen='home';
  if(CH==='portal'){ S.posState='create'; S.amtStr=''; S.amount=0; }
  else S.posState='cart';
  render();
}

const STEPS = {
  pos:['Ring up','Choose Got It','Customer scans QR','Pick vouchers','Confirm'],
  portal:['Log in','Enter amount','Customer scans QR','Pick vouchers','Confirm'],
};
function curStep(){
  if(CH==='portal'){
    if(S.posState==='login') return 1;
    if(S.posState==='create') return 2;
    return {home:3,scan:3,verify:3,error:3,review:4,processing:5,success:5}[S.screen];
  }
  if(S.posState==='cart') return 1;
  if(S.posState==='method') return 2;
  return {home:2,scan:3,verify:3,error:3,review:4,processing:5,success:5}[S.screen];
}
function render(){
  document.getElementById('chan').innerHTML =
    `<button class="${CH==='pos'?'on':''}" onclick="setChannel('pos')">Integrated POS</button>
     <button class="${CH==='portal'?'on':''}" onclick="setChannel('portal')">Cashier Portal <em>NEW</em></button>`;
  const cur=curStep(), done=S.posState==='paid';
  document.getElementById('steps').innerHTML = STEPS[CH].map((t,i)=>{
    const n=i+1; return `<div class="step${done||n<cur?' done':n===cur?' on':''}"><b>${n}</b> ${t}</div>`;
  }).join('');
  document.getElementById('stage').classList.toggle('portal', CH==='portal');
  renderCashier();
  const el=document.getElementById('screen');
  el.innerHTML = ({home:scHome,scan:scScan,verify:scVerify,review:scReview,
                   processing:scProcessing,success:scSuccess,error:scError})[S.screen]();
  if(S.screen==='scan'){const c=el.querySelector('#scanqr'); if(c) drawQR(c, QR_SIZE, qrSeed());}
  document.getElementById('scenarios').innerHTML = Object.entries(SCENARIOS).map(([k,v])=>
    `<button class="${S.scenario===k?'on':''}" title="${v.desc}" onclick="reset('${k}')">${v.label}</button>`).join('');
  if(S.modal) document.querySelector('.modal').scrollIntoView({block:'nearest'});
}
/* scale the device area to fit one screen when presenting */
function fit(){
  const st=document.getElementById('stage'); st.style.zoom=1;
  if(innerWidth<=900) return;
  const top=st.getBoundingClientRect().top+scrollY;
  st.style.zoom=Math.max(.6, Math.min(1, (innerHeight-top-20)/st.offsetHeight));
}
addEventListener('resize', fit);
reset('full'); fit();
</script>
