<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Got It · Demo luồng quét QR thanh toán voucher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --red:#E8322A; --red-dark:#C0231C; --ink:#131313; --muted:#8A8F98;
    --line:#EDEEF0; --teal:#00A3A1; --green:#12A150;
    --panel:#171B22; --panel-2:#1F242D;
    --font:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:28px 20px 20px;font-family:var(--font);
    background:radial-gradient(1200px 700px at 50% -10%,#1C222B,#0E1116 60%);color:#E7EAF0;min-height:100vh}
  h1,h2,h3,h4,p{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  svg{display:block}

  .head{max-width:1180px;margin:0 auto 22px;text-align:center}
  .head h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .head p{font-size:13.5px;color:#98A1AE;margin-top:6px}
  .steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);
    border:1px solid #262C36;font-size:12.5px;color:#8892A0;transition:.25s}
  .step b{width:19px;height:19px;border-radius:50%;background:#2A313C;color:#98A1AE;display:grid;place-items:center;
    font-size:11px;font-weight:700;transition:.25s}
  .step.on{background:rgba(232,50,42,.13);border-color:rgba(232,50,42,.5);color:#FFCFCC}
  .step.on b{background:var(--red);color:#fff}
  .step.done{color:#6FCF97;border-color:rgba(18,161,80,.35)}
  .step.done b{background:var(--green);color:#fff}

  .stage{max-width:880px;margin:28px auto 0;display:grid;grid-template-columns:380px 412px;gap:56px;justify-content:center;align-items:center}
  @media(max-width:900px){.stage{grid-template-columns:1fr;max-width:420px;gap:28px}
    .stage>.col-pos{order:2}.stage>.col-phone{order:1}}
  .dev-label{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#6E7887;margin-bottom:12px;text-align:center}
  .bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
  .scen{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid #262C36;flex-wrap:wrap;justify-content:center}
  .scen button{padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:#98A1AE;transition:.18s}
  .scen button:hover{color:#fff}
  .scen button.on{background:#2A313C;color:#fff}
  .reset{width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid #262C36;color:#98A1AE;font-size:17px}
  .reset:hover{color:#fff;border-color:#3C4553}


  .pos{background:linear-gradient(180deg,#12161C,#0B0E13);border:1px solid #2A313C;border-radius:14px;padding:18px;text-align:center}
  .pos-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .pos-logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#C9D2DF}
  .pos-logo i{width:22px;height:22px;border-radius:6px;background:#2F80ED;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff}
  .pos-status{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#2A313C;color:#98A1AE}
  .pos-status.wait{background:rgba(245,165,36,.15);color:#F5A524}
  .pos-status.live{background:rgba(47,128,237,.16);color:#68A8F5}
  .pos-status.ok{background:rgba(18,161,80,.16);color:#4ADE80}
  .pos-amount{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff}
  .pos-order{font-size:11.5px;color:#6E7887;margin-bottom:16px}
  .qrbox{background:#fff;border-radius:12px;padding:12px;display:inline-block;position:relative}
  .qrbox .qrlogo{position:absolute;inset:0;margin:auto;width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
  .qrlogo span{width:28px;height:28px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:8.5px;font-weight:800;line-height:1.05}
  .qr-hint{font-size:11.5px;color:#6E7887;margin-top:12px;line-height:1.5}
  .pos-done{padding:26px 8px}
  .pos-done .tick{width:52px;height:52px;border-radius:50%;background:rgba(18,161,80,.15);color:#4ADE80;display:grid;place-items:center;margin:0 auto 12px;font-size:26px}
  .pos-done h4{font-size:15px;font-weight:700;color:#fff}
  .pos-done p{font-size:12px;color:#7E8896;margin-top:6px}
  .pos-line{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-top:1px dashed #2A313C;color:#9AA4B2}
  .pos-line b{color:#fff;font-weight:600}


  /* ================= PHONE ================= */
  .col-phone{display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone{width:412px;height:846px;background:#000;border-radius:54px;padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px #333;position:relative;flex:none}
  @media(max-width:430px){.phone{width:100%;height:800px;border-radius:42px}}
  .screen{width:100%;height:100%;background:#fff;border-radius:44px;overflow:hidden;position:relative;color:var(--ink);display:flex;flex-direction:column}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:118px;height:30px;background:#000;border-radius:999px;z-index:60}

  .sbar{display:flex;justify-content:space-between;align-items:center;padding:17px 30px 2px;flex:none;z-index:50;position:relative}
  .sbar .t{font-size:16px;font-weight:600;letter-spacing:.01em}
  .sbar .r{display:flex;align-items:center;gap:6px}
  .sbar.dark .t,.sbar.dark .r{color:#fff}
  .batt{width:26px;height:14px;border-radius:4px;background:#31D158;display:grid;place-items:center;color:#0B3D1B;font-size:9px;font-weight:800}
  .camdot{width:9px;height:9px;border-radius:50%;background:#31D158;position:absolute;top:22px;left:50%;transform:translateX(48px);z-index:61}

  .view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
  .view::-webkit-scrollbar{width:0}

  /* ---- Trang chủ ---- */
  .balance{padding:12px 22px 0;display:flex;justify-content:space-between;align-items:flex-start}
  .balance .amt{font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
  .balance .sub{font-size:16px;color:#2C3138;margin-top:1px;font-weight:500}
  .balance .sub b{font-weight:800;color:var(--ink)}

  .searchrow{display:flex;gap:11px;padding:18px 22px 0;align-items:center}
  .search{flex:1;height:45px;border:1.5px solid #E6E8EC;border-radius:13px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#A9AEB6;font-size:14px}
  .bell{width:45px;height:45px;border:1.5px solid #E6E8EC;border-radius:13px;display:grid;place-items:center;position:relative;flex:none}
  .bell em{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;border:2px solid #fff}

  .quick{display:grid;grid-template-columns:repeat(4,1fr);padding:22px 14px 0;text-align:center}
  .quick .q{font-size:12.5px;font-weight:700;line-height:1.32;color:var(--ink)}
  .quick .q .ic{height:42px;display:grid;place-items:center;margin-bottom:8px}

  .banner{margin:20px 22px 0;border-radius:13px;background:linear-gradient(160deg,#EE342C,#CF241D);color:#fff;padding:16px 14px 14px;text-align:center;position:relative;overflow:hidden}
  .banner .deco{position:absolute;top:-40px;left:-40px;width:150px;height:150px;border-radius:50%;
    background:repeating-radial-gradient(circle,transparent 0 6px,rgba(255,255,255,.16) 6px 7px);opacity:.9}
  .banner h4{position:relative;font-size:19px;font-weight:800;letter-spacing:.01em;
    background:linear-gradient(180deg,#FFF6D6 20%,#F6CF6E 55%,#D99B2E);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(120,20,15,.55))}
  .banner .brand{position:relative;font-size:19px;font-weight:800;margin:5px 0 9px;display:flex;align-items:center;justify-content:center;gap:6px}
  .banner .row{position:relative;display:flex;justify-content:center;font-size:10.5px;font-weight:700;line-height:1.5}
  .banner .row span{padding:0 13px}
  .banner .row span+span{border-left:1px solid rgba(255,255,255,.4)}
  .banner .white{position:relative;background:#fff;color:#111;border-radius:8px;padding:9px 10px;margin-top:11px;font-size:10.5px;line-height:1.55;font-weight:600}

  .sec-title{font-size:19px;font-weight:800;padding:26px 22px 13px;letter-spacing:-.02em}

  .ticket{position:relative;margin:0 22px;background:#fff;border:1px solid #ECEDF0;border-radius:14px;
    box-shadow:0 3px 14px rgba(0,0,0,.05);display:flex;align-items:center;min-height:126px;overflow:hidden}
  .ticket .best{position:absolute;top:0;right:0;background:linear-gradient(95deg,#00A3A1,#12B76A);color:#fff;
    font-size:11px;font-weight:700;padding:6px 12px;border-radius:0 13px 0 13px}
  .tk-left{width:130px;flex:none;text-align:center;padding:14px 8px}
  .tk-left .thumb{width:88px;height:62px;margin:0 auto;border-radius:7px;
    background:linear-gradient(135deg,#FFE3E0,#FFC0BA 60%,#FFA9A1);display:grid;place-items:center;position:relative}
  .tk-left .thumb b{font-size:9px;font-weight:800;color:#C0231C;letter-spacing:.02em}
  .tk-left .cap{font-size:12.5px;color:#5A616B;margin-top:9px}
  .tk-div{position:absolute;left:130px;top:12px;bottom:12px;border-left:1.5px dashed #DEE0E4}
  .tk-notch{position:absolute;left:130px;width:18px;height:18px;border-radius:50%;background:#fff;
    border:1px solid #ECEDF0;transform:translateX(-50%)}
  .tk-notch.t{top:-9px;clip-path:inset(50% 0 0 0)}
  .tk-notch.b{bottom:-9px;clip-path:inset(0 0 50% 0)}
  .tk-right{flex:1;padding:26px 16px 14px 20px}
  .tk-right .tag{font-size:12.5px;color:#8A8F98}
  .tk-right .nm{font-size:17px;font-weight:500;margin:3px 0 4px;letter-spacing:-.01em}
  .tk-right .pr{font-size:23px;font-weight:800;letter-spacing:-.025em}
  .tk-right .ex{font-size:12.5px;color:#7A808A;margin-top:5px}

  .brands{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:0 22px 26px}
  .brands div{height:70px;border:1px solid #EDEEF0;border-radius:13px;display:grid;place-items:center}

  .nav{display:flex;border-top:1px solid #EFEFF1;background:#fff;padding:8px 0 24px;flex:none;z-index:40}
  .nav button{flex:1;text-align:center;font-size:12px;font-weight:600;color:#8E949C}
  .nav button .ic{height:26px;display:grid;place-items:center;margin-bottom:3px}
  .nav button.on{color:var(--red)}

  /* ---- Scanner ---- */
  .scanner{position:absolute;inset:0;background:#15181D;z-index:70;display:flex;flex-direction:column;color:#fff}
  .cam{position:absolute;inset:0;background:linear-gradient(112deg,#575D66,#2A2E35 50%,#464B54);overflow:hidden}
  .shade{position:absolute;inset:0;background:rgba(0,0,0,.52)}
  .hole{position:absolute;left:50%;transform:translateX(-50%);width:264px;height:264px;border-radius:20px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.52);overflow:hidden}
  .scan-top{position:relative;display:flex;justify-content:space-between;padding:52px 30px 0;z-index:3}
  .scan-title{position:relative;text-align:center;font-size:17px;font-weight:500;margin-top:36px;z-index:3;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .framewrap{position:relative;z-index:3;margin-top:24px;height:264px}
  .corners{position:absolute;left:50%;top:0;transform:translateX(-50%);width:290px;height:264px;pointer-events:none}
  .corners i{position:absolute;width:44px;height:44px;border:5px solid #F2F2F2}
  .corners i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
  .corners i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
  .corners i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
  .corners i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
  .target{position:absolute;left:50%;top:0;transform:translateX(-50%);width:264px;height:264px;border-radius:20px;
    overflow:hidden;cursor:pointer;transition:transform .16s}
  .target:active{transform:translateX(-50%) scale(.97)}
  .scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:sl 2.2s ease-in-out infinite;z-index:4}
  @keyframes sl{0%,100%{top:16px}50%{top:246px}}
  .scan-bottom{position:relative;z-index:3;margin-top:auto;display:flex;justify-content:space-around;padding:0 26px 46px;font-size:14px;text-align:center}
  .scan-bottom .ic{height:34px;display:grid;place-items:center;margin-bottom:6px}

  /* ---- Payment screens ---- */
  .topbar{display:flex;align-items:center;gap:12px;padding:8px 20px 14px;border-bottom:1px solid var(--line);flex:none}
  .topbar h3{font-size:16.5px;font-weight:700}
  .merchant{display:flex;gap:12px;align-items:center;padding:18px 22px 4px}
  .mlogo{width:46px;height:46px;border-radius:12px;background:#0B6E4F;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
  .merchant .nm{font-size:15.5px;font-weight:700}
  .merchant .ad{font-size:12px;color:var(--muted);margin-top:2px}
  .bigamt{text-align:center;padding:14px 22px 18px}
  .bigamt .lb{font-size:13px;color:var(--muted)}
  .bigamt .vl{font-size:37px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
  .bigamt .oid{font-size:11.5px;color:var(--muted);margin-top:6px}

  .block{margin:0 22px 14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .block-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#FAFAFB;border-bottom:1px solid var(--line)}
  .block-h span{font-size:12.5px;font-weight:700;color:#4A505A}
  .block-h button{font-size:12.5px;font-weight:700;color:var(--red)}
  .vrow{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:none}
  .vrow.dis{opacity:.42}
  .chk{width:22px;height:22px;border-radius:7px;border:2px solid #D6D9DE;flex:none;display:grid;place-items:center;font-size:12px;color:#fff;transition:.15s;font-weight:700}
  .vrow.sel .chk{background:var(--red);border-color:var(--red)}
  .vmini{width:46px;height:33px;border-radius:6px;background:linear-gradient(135deg,#FFE3E0,#FFB3AE);flex:none;display:grid;place-items:center;font-size:8px;font-weight:800;color:#B4231C}
  .vinfo{flex:1;min-width:0}
  .vinfo .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vinfo .s{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .vamt{text-align:right;flex:none}
  .vamt .a{font-size:14px;font-weight:800}
  .vamt .u{font-size:10.5px;color:var(--green);font-weight:700;margin-top:2px}
  .pill{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;margin-right:4px}
  .pill.brand{background:#E7F6F5;color:var(--teal)}
  .pill.split{background:#FFF3E0;color:#B26A00}
  .pill.sug{background:#FDECEB;color:var(--red)}
  .pill.no{background:#F1F2F4;color:#6B7280}
  .sumrow{display:flex;justify-content:space-between;padding:9px 14px;font-size:13px;color:#4A505A}
  .sumrow b{font-weight:700;color:var(--ink)}
  .sumrow.big{border-top:1px dashed var(--line);margin-top:4px;padding-top:12px;font-size:14.5px}
  .sumrow.big b{font-size:18px;font-weight:800;color:var(--red)}
  .sumrow .green{color:var(--green);font-weight:700}
  .warn{margin:0 22px 14px;background:#FFF8E6;border:1px solid #F7E2A8;border-radius:12px;padding:12px 13px;font-size:12px;line-height:1.6;color:#7A5A00}
  .cta{padding:14px 22px 26px;border-top:1px solid var(--line);background:#fff;flex:none}
  .btn{width:100%;height:52px;border-radius:14px;background:var(--red);color:#fff;font-size:15.5px;font-weight:700;display:grid;place-items:center;transition:.15s}
  .btn:active{background:var(--red-dark)}
  .btn.ghost{background:#fff;color:#4A505A;border:1.5px solid #E4E6EA;height:48px;font-size:14.5px;margin-top:9px}
  .btn[disabled]{background:#E4E6EA;color:#A6ABB3;cursor:not-allowed}

  /* ---- POPUP XÁC NHẬN ---- */
  .modal{position:absolute;inset:0;background:rgba(10,12,16,.5);z-index:90;display:grid;place-items:center;padding:0 22px;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}}
  .modal-in{width:100%;background:#fff;border-radius:22px;overflow:hidden;animation:pop2 .26s cubic-bezier(.2,1.2,.4,1);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  @keyframes pop2{from{transform:scale(.9);opacity:0}}
  .m-head{padding:22px 22px 0;text-align:center}
  .m-head .ic{width:54px;height:54px;border-radius:50%;background:#FDECEB;display:grid;place-items:center;margin:0 auto 12px}
  .m-head h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .m-head p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  .m-amt{text-align:center;padding:16px 22px 4px}
  .m-amt .v{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--red)}
  .m-amt .l{font-size:12px;color:var(--muted);margin-top:2px}
  .m-body{margin:14px 22px 0;border-top:1px dashed #E2E4E8;padding-top:12px}
  .m-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:#5A616B;padding:6px 0}
  .m-row b{color:var(--ink);font-weight:600;text-align:right}
  .m-row .g{color:var(--green);font-weight:700}
  .m-note{margin:14px 22px 0;background:#F6F7F9;border-radius:11px;padding:11px 12px;font-size:11.5px;line-height:1.6;color:#5A616B}
  .m-foot{display:flex;gap:10px;padding:18px 22px 22px}
  .m-foot button{flex:1;height:50px;border-radius:14px;font-size:15px;font-weight:700}
  .m-foot .cancel{background:#F2F3F5;color:#4A505A}
  .m-foot .ok{background:var(--red);color:#fff;flex:1.4}
  .m-foot .ok:active{background:var(--red-dark)}

  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 36px;text-align:center}
  .spin{width:46px;height:46px;border:3.5px solid #F0F1F3;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center h3{font-size:17px;font-weight:700;margin-top:20px}
  .center p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
  .okmark{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:44px;animation:pop2 .4s cubic-bezier(.2,1.4,.4,1)}
  .badmark{width:84px;height:84px;border-radius:50%;background:#FDECEB;color:var(--red);display:grid;place-items:center;font-size:40px}
  .rcpt{width:100%;margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:4px 0;text-align:left}
  .rcpt .r{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;font-size:12.5px;color:#5A616B}
  .rcpt .r b{color:var(--ink);font-weight:600;text-align:right}
  .pill.linke{background:#E7F6F5;color:var(--teal)}
  .pill.linkv{background:#EEF0FF;color:#4F46E5}
  .pill.soon{background:#FFF3E0;color:#B26A00}
  .vamt .u.lost{color:#B26A00}
  .sumrow .lostc{color:#B26A00;font-weight:700}

  /* ---- Chọn kênh ---- */
  .chan{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid #262C36}

<script>
/* ================= DỮ LIỆU ================= */
const TODAY = '26/10/2026';
const SOON_DAYS = 30;     // "sắp hết hạn" = còn ≤ 30 ngày (giả định của demo)
const OVER_MAX = 20000;   // voucher không tách được phép lớn hơn số cần trả tối đa 20k
/* split:true = link E (chưa gắn brand, tách được) · split:false = link V (đã gắn brand, không tách) */
const VOUCHERS = [
  {id:'v1', name:'Quà Tặng Got It',        value:25000,  split:true,  exp:'05/11/2026', brand:'any'},
  {id:'v2', name:'Got It eGift',           value:500000, split:true,  exp:'31/12/2026', brand:'any'},
  {id:'v3', name:'Phúc Long eGift',        value:100000, split:false, exp:'15/01/2027', brand:'phuclong',  brandName:'Phúc Long'},
  {id:'v4', name:'Phúc Long eGift',        value:50000,  split:false, exp:'10/11/2026', brand:'phuclong',  brandName:'Phúc Long'},
  {id:'v5', name:'Highlands Coffee eGift', value:96000,  split:false, exp:'01/12/2026', brand:'highlands', brandName:'Highlands Coffee'},
];
const SCENARIOS = {
  full:    {label:'Đủ tiền',      desc:'Đơn 358.000đ · gợi ý 4 voucher, không phải trả thêm',       amount:358000,  err:null},
  partial: {label:'Thiếu tiền',            desc:'Đơn 1.850.000đ · thiếu, trả thêm tại quầy',                 amount:1850000, err:null},
  over:    {label:'Dư ≤ 20k', desc:'Đơn 40.000đ · link V 50.000đ dư 10.000đ, dùng kèm cảnh báo', amount:40000,   err:null},
  expired: {label:'QR hết hạn',               desc:'Khách quét sau 3 phút kể từ lúc tạo mã',                    amount:358000,  err:'expired'},
  paid:    {label:'Đã thanh toán',      desc:'Khách quét lại mã cũ',                                      amount:358000,  err:'paid'},
};
const CART_358 = [['Trà Sen Vàng (L)',2,65000],['Trà Sữa Phúc Long',2,59000],['Bánh Mì Chà Bông',2,35000],['Bánh Croissant',1,40000]];
const CARTS = {full:CART_358, expired:CART_358, paid:CART_358,
  partial:[['Hộp quà Trà Phúc Long',2,450000],['Cà Phê Hạt 500g',2,320000],['Trà Sen Vàng (L)',4,65000],['Bánh Tiramisu',1,50000]],
  over:[['Trà Đào (M)',1,40000]]};
const MERCHANT = {name:'Phúc Long Coffee & Tea', code:'PL', brand:'phuclong',
                  addr:{pos:'Lê Lợi, Quận 1 · POS 02', portal:'Lê Lợi, Quận 1 · Quầy 02 · Portal'}};
const money = n => n.toLocaleString('vi-VN') + 'đ';
const applicable = v => v.brand==='any' || v.brand===MERCHANT.brand;
const toDate = s => {const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d)};
const soon = v => (toDate(v.exp)-toDate(TODAY))/864e5 <= SOON_DAYS;
const rnd4 = () => 1000+Math.floor(Math.random()*8999);
const newOrderId = () => '#PL2610'+rnd4();

/* ================= ICON ================= */
const I = {
  search:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9AA0A8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  bell:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#131313" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>',
  vip:'<svg width="42" height="42" viewBox="0 0 44 44" fill="none"><path d="M22 3l4.3 3.1 5.3-.5 1.7 5 4.6 2.7-1.3 5.2 2.6 4.6-3.7 3.8-.6 5.3-5.1 1.5-3.4 4.1L22 35.4l-4.4 2.4-3.4-4.1-5.1-1.5-.6-5.3L4.8 23l2.6-4.6-1.3-5.2 4.6-2.7 1.7-5 5.3.5z" stroke="#131313" stroke-width="2" stroke-linejoin="round"/><text x="22" y="25.5" text-anchor="middle" font-family="Be Vietnam Pro,sans-serif" font-size="11" font-weight="800" fill="#E8322A">VIP</text></svg>',
  topup:'<svg width="42" height="42" viewBox="0 0 44 44" fill="none" stroke="#131313" stroke-width="2" stroke-linejoin="round"><rect x="11" y="5" width="22" height="34" rx="4"/><path d="M15 33h9" stroke-width="3" stroke-linecap="round"/><path d="M26 13h8M30 9v8" stroke="#E8322A" stroke-width="2.6" stroke-linecap="round"/></svg>',
  bill:'<svg width="42" height="42" viewBox="0 0 44 44" fill="none" stroke="#131313" stroke-width="2" stroke-linejoin="round"><path d="M11 5h22v34l-5-3-6 3-6-3-5 3z"/><path d="M16 30h8" stroke-width="3" stroke-linecap="round"/><text x="22" y="22" text-anchor="middle" font-family="Be Vietnam Pro,sans-serif" font-size="14" font-weight="800" fill="#E8322A" stroke="none">$</text></svg>',
  fuel:'<svg width="42" height="42" viewBox="0 0 44 44" fill="none" stroke="#131313" stroke-width="2" stroke-linejoin="round"><rect x="8" y="6" width="20" height="32" rx="3"/><path d="M12 30h12" stroke-width="3" stroke-linecap="round"/><path d="M28 14h5a3 3 0 013 3v14a2.5 2.5 0 01-5 0V24h-3"/><path d="M18 11c2.6 2.6 4 4.4 4 6a4 4 0 11-8 0c0-1.6 1.4-3.4 4-6z" fill="#E8322A" stroke="none"/></svg>',
  home:'<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 10.5L12 3.5l9 7V20a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 20z"/></svg>',
  gift:'<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="13" rx="1.6"/><path d="M2.5 12.5h19M12 8v13"/><path d="M12 8S9.5 3 7.2 4.2 9 8 12 8zM12 8s2.5-5 4.8-3.8S15 8 12 8z"/></svg>',
  scan:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5.5A2.5 2.5 0 015.5 3H8M16 3h2.5A2.5 2.5 0 0121 5.5V8M21 16v2.5a2.5 2.5 0 01-2.5 2.5H16M8 21H5.5A2.5 2.5 0 013 18.5V16"/><path d="M3 12h18"/></svg>',
  phone:'<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3.5h3.5l2 5-2.2 1.5a13 13 0 005.7 5.7l1.5-2.2 5 2V19a2 2 0 01-2.2 2C10.6 20.3 3.7 13.4 3 5.7A2 2 0 015 3.5z"/></svg>',
  user:'<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.9-6 7.5-6s6.7 2 7.5 6"/></svg>',
  flashoff:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"><path d="M13 2L5 13h5l-1 9 8-11h-5z"/><path d="M3 3l18 18" stroke-linecap="round"/></svg>',
  close:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>',
  image:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6" fill="#fff"/><path d="M4 17l5-5 4 4 3-2.5 4 3.5"/></svg>',
  history:'<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 10A9 9 0 1112 21a9 9 0 01-7-3.4"/><path d="M3 4.5V10h5.5"/><path d="M12 7.5V12l3 2"/></svg>',
  back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#131313" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  wifi:'<svg width="17" height="13" viewBox="0 0 17 13" fill="currentColor"><path d="M8.5 12.4l2.3-2.8a3.6 3.6 0 00-4.6 0zM8.5 6.1c1.6 0 3.1.6 4.2 1.6l1.6-1.9a9 9 0 00-11.6 0l1.6 1.9a6.3 6.3 0 014.2-1.6zM8.5 1.6c2.7 0 5.2 1 7.1 2.6L17 2.6A12.3 12.3 0 008.5-.4 12.3 12.3 0 000 2.6l1.4 1.6A10.8 10.8 0 018.5 1.6z"/></svg>',
  sig:'<svg width="19" height="13" viewBox="0 0 19 13" fill="currentColor"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1" opacity=".35"/></svg>',
  shield:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8322A" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.9-8 10-4.6-1.1-8-5-8-10v-6z"/><path d="M8.6 12.2l2.4 2.4 4.4-4.6" stroke-linecap="round"/></svg>',
};

/* ================= STATE ================= */
let CH = location.hash==='#portal' ? 'portal' : 'pos';   // kênh: POS tích hợp | Portal trên máy thu ngân
let AUTH = false;                                         // portal đã đăng nhập — giữ khi đổi kịch bản
let S = {};
/* posState — POS: cart|method|waiting|scanned|paid|expired · Portal: login|create|waiting|scanned|paid|expired */
function reset(sc){
  const key = sc || S.scenario || 'full', amt = SCENARIOS[key].amount;
  S = {scenario:key, amount:amt, amtStr:String(amt), err:SCENARIOS[key].err, phoneErr:null,
       orderId:newOrderId(), billNo:'HD-'+rnd4(), qrN:0, wpTab:'qr',
       screen:'home', picking:false, selected:[], modal:false,
       posState: CH==='portal' ? (AUTH?'create':'login') : 'cart'};
  S.selected = suggest();
  render();
}
function restart(){ AUTH=false; reset(); }
function setChannel(c){
  CH=c; history.replaceState(null,'',c==='portal'?'#portal':location.pathname+location.search);
  reset();
}

/* thứ tự ưu tiên: sắp hết hạn → không tách (link V) → HSD gần hơn */
const rank = v => [soon(v)?0:1, v.split?1:0, toDate(v.exp)];
function byPriority(a,b){ const x=rank(a), y=rank(b); return x[0]-y[0] || x[1]-y[1] || x[2]-y[2]; }

function suggest(){
  const picked=[]; let left=S.amount;
  for(const v of VOUCHERS.filter(applicable).sort(byPriority)){
    if(left<=0) break;
    if(!v.split && v.value-left>OVER_MAX) continue;   // không tách mà dư quá 20k thì bỏ qua
    picked.push(v.id); left -= Math.min(v.value,left);
  }
  return picked;
}

/* voucher có được phép chọn thêm không */
function blockReason(v, restBefore){
  if(!applicable(v)) return 'Chỉ dùng tại '+v.brandName;
  if(restBefore<=0) return 'Đơn đã đủ tiền';
  if(!v.split && v.value-restBefore>OVER_MAX) return 'Lớn hơn số cần trả quá 20.000đ';
  return null;
}
function restExcluding(id){
  let left = S.amount;
  for(const vid of S.selected){
    if(vid===id) continue;
    left -= Math.min(VOUCHERS.find(x=>x.id===vid).value, Math.max(left,0));
  }
  return Math.max(left,0);
}
function calc(){
  let left=S.amount, applied=[], refund=0, lost=0;
  for(const id of S.selected){
    const v = VOUCHERS.find(x=>x.id===id);
    const use = Math.min(v.value, Math.max(left,0));
    const keep = v.split ? v.value-use : 0, loss = v.split ? 0 : v.value-use;
    applied.push({v, use, keep, lost:loss});
    refund += keep; lost += loss; left -= use;
  }
  const rest = Math.max(left,0);
  return {applied, rest, refund, lost, paid:S.amount-rest};
}

/* ================= QR ================= */
function drawQR(cv,size,seed){
  const N=29, px=Math.floor(size/N), s=px*N;
  cv.width=s; cv.height=s; const c=cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,s,s); c.fillStyle='#0B0E13';
  let r=seed; const rnd=()=>{r=(r*1103515245+12345)&0x7fffffff;return r/0x7fffffff};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if((x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9)) continue;
    if(rnd()>0.52) c.fillRect(x*px,y*px,px,px);
  }
  const f=(ox,oy)=>{c.fillRect(ox*px,oy*px,7*px,7*px);c.fillStyle='#fff';c.fillRect((ox+1)*px,(oy+1)*px,5*px,5*px);
    c.fillStyle='#0B0E13';c.fillRect((ox+2)*px,(oy+2)*px,3*px,3*px)};
  f(0,0); f(N-7,0); f(0,N-7);
}

        ${k.applied.map(a=>`<div class="m-row"><span>${a.v.name}</span><b>−${money(a.use)}</b></div>`).join('')}
        <div class="m-row" style="border-top:1px dashed #E2E4E8;margin-top:6px;padding-top:10px"><span>Tổng đơn</span><b>${money(S.amount)}</b></div>
        ${k.refund>0?`<div class="m-row"><span>Giữ lại trong kho quà</span><b class="g">${money(k.refund)}</b></div>`:''}
        ${k.lost>0?`<div class="m-row"><span>Phần dư không hoàn</span><b style="color:#B26A00">${money(k.lost)}</b></div>`:''}
        <div class="m-row"><span>Còn phải trả tại quầy</span><b style="color:${k.rest>0?'var(--red)':'inherit'}">${money(k.rest)}</b></div>
      </div>
      ${k.lost>0?`<div class="m-note">Phần dư <b>${money(k.lost)}</b> của voucher không tách sẽ không được hoàn.</div>`:''}
      <div class="m-foot">
        <button class="cancel" onclick="closeModal()">Huỷ</button>
        <button class="ok" onclick="pay()">Xác nhận</button>
      </div>
    </div>
  </div>`;
}

function scProcessing(){
  return sbar(false)+`<div class="center"><div class="spin"></div>
    <h3>Đang xử lý thanh toán</h3></div>`;
}
function scSuccess(){
  const k=calc();
  return sbar(false)+`<div class="center">
    <div class="okmark">✓</div>
    <h3 style="font-size:19px">Thanh toán thành công</h3>
    <p>Quầy ${MERCHANT.name} đã nhận được thanh toán</p>
    <div style="font-size:32px;font-weight:800;margin-top:16px">−${money(k.paid)}</div>
    <div class="rcpt">
      <div class="r"><span>Mã giao dịch</span><b>${S.orderId}</b></div>
      ${CH==='portal'?`<div class="r"><span>Số hoá đơn</span><b>${S.billNo||'—'}</b></div>`:''}
      <div class="r"><span>Voucher đã dùng</span><b>${k.applied.map(a=>a.v.name).join('<br>')}</b></div>
      ${k.refund>0?`<div class="r"><span>Giữ lại trong kho quà</span><b style="color:var(--green)">${money(k.refund)}</b></div>`:''}
      ${k.lost>0?`<div class="r"><span>Phần dư không hoàn</span><b style="color:#B26A00">${money(k.lost)}</b></div>`:''}
      ${k.rest>0?`<div class="r"><span>Trả thêm tại quầy</span><b>${money(k.rest)}</b></div>`:''}
      <div class="r"><span>Số dư còn lại</span><b>${money(VOUCHERS.reduce((s,v)=>s+v.value,0)-k.paid-k.lost)}</b></div>
      <div class="r"><span>Thời gian</span><b>15:26 · ${TODAY}</b></div>
    </div></div>
  <div class="cta"><button class="btn" onclick="go('home')">Về trang chủ</button>
    <button class="btn ghost">Xem chi tiết giao dịch</button></div>`;
}
function scError(){
  const t = {
    expired:  {i:'⏱',h:'Mã QR đã hết hạn',p:'Mã này chỉ có hiệu lực 3 phút. Nhờ thu ngân tạo lại mã QR rồi quét lần nữa.',b:'Quét lại'},
    paid:     {i:'✓',h:'Đơn hàng đã được thanh toán',p:`Đơn ${S.orderId} đã thanh toán lúc 15:21 hôm nay. Không có khoản nào bị trừ thêm.`,b:'Xem giao dịch cũ'},
    cancelled:{i:'✕',h:'Thu ngân đã huỷ mã QR',p:'Không có voucher nào bị trừ. Nếu vẫn muốn dùng voucher, nhờ thu ngân tạo mã mới rồi quét lại.',b:'Quét lại'},
  }[S.phoneErr];
  return sbar(false)+`<div class="center"><div class="badmark">${t.i}</div>
    <h3 style="font-size:18px">${t.h}</h3><p>${t.p}</p></div>
  <div class="cta"><button class="btn" onclick="go('scan')">${t.b}</button>
    <button class="btn ghost" onclick="go('home')">Về trang chủ</button></div>`;
}

/* ================= HÀNH ĐỘNG ================= */
function go(s){ S.screen=s; S.modal=false; if(s==='home'&&S.posState==='scanned') S.posState='waiting'; render(); }
function doScan(){
  if(!qrLive()) return;
  S.screen='verify'; S.posState='scanned'; render();
  setTimeout(()=>{
    if(S.screen!=='verify') return;   // thu ngân đã huỷ hoặc demo đã chạy lại trong lúc chờ
    if(S.err){S.phoneErr=S.err; S.screen='error'; S.posState=S.err==='expired'?'expired':'waiting';}
    else {S.screen='review'; S.picking=false; S.selected=suggest();}
    render();
  },1100);
}
function toggle(id){
  S.selected = S.selected.includes(id) ? S.selected.filter(x=>x!==id) : [...S.selected,id];
  render();
}
function togglePick(){S.picking=!S.picking; render()}
function openModal(){S.modal=true; render()}
function closeModal(){S.modal=false; render()}
function pay(){
  S.modal=false; S.screen='processing'; render();
  setTimeout(()=>{ if(S.screen!=='processing') return; S.screen='success'; S.posState='paid'; render() },1500);
}

/* phía thu ngân */
function login(){ AUTH=true; S.posState='create'; render(); }
function keyIn(k){
  if(k==='clr') S.amtStr='';
  else if(k==='del') S.amtStr=S.amtStr.slice(0,-1);
  else if((S.amtStr+k).length<=10) S.amtStr=(S.amtStr+k).replace(/^0+/,'');
  S.amount=+S.amtStr||0; render();
}
function createQR(){ if(!S.amount) return; S.qrN++; S.posState='waiting'; S.selected=suggest(); render(); }
function renewQR(){ S.err=null; S.qrN++; S.posState='waiting'; render(); }
function cancelQR(){
  if(S.screen==='processing') return;
  S.posState = CH==='portal' ? 'create' : 'method';
  if(S.screen==='verify'||S.screen==='review'){ S.screen='error'; S.phoneErr='cancelled'; S.modal=false; S.picking=false; }
  render();
}
function newOrder(){
  S.orderId=newOrderId(); S.billNo='HD-'+rnd4(); S.qrN++;
  S.err=null; S.selected=[]; S.picking=false; S.modal=false; S.screen='home';
  if(CH==='portal'){ S.posState='create'; S.amtStr=''; S.amount=0; }
  else S.posState='cart';
  render();
}

const STEPS = {
  pos:['Tính tiền','Chọn Got It','Khách quét QR','Chọn voucher','Xác nhận'],
  portal:['Đăng nhập','Nhập số tiền','Khách quét QR','Chọn voucher','Xác nhận'],
};
function curStep(){
  if(CH==='portal'){
    if(S.posState==='login') return 1;
    if(S.posState==='create') return 2;
    return {home:3,scan:3,verify:3,error:3,review:4,processing:5,success:5}[S.screen];
  }
  if(S.posState==='cart') return 1;
  if(S.posState==='method') return 2;
  return {home:2,scan:3,verify:3,error:3,review:4,processing:5,success:5}[S.screen];
}
function render(){
  document.getElementById('chan').innerHTML =
    `<button class="${CH==='pos'?'on':''}" onclick="setChannel('pos')">POS tích hợp</button>
     <button class="${CH==='portal'?'on':''}" onclick="setChannel('portal')">Portal thu ngân <em>MỚI</em></button>`;
  const cur=curStep(), done=S.posState==='paid';
  document.getElementById('steps').innerHTML = STEPS[CH].map((t,i)=>{
    const n=i+1; return `<div class="step${done||n<cur?' done':n===cur?' on':''}"><b>${n}</b> ${t}</div>`;
  }).join('');
  document.getElementById('stage').classList.toggle('portal', CH==='portal');
  renderCashier();
  const el=document.getElementById('screen');
  el.innerHTML = ({home:scHome,scan:scScan,verify:scVerify,review:scReview,
                   processing:scProcessing,success:scSuccess,error:scError})[S.screen]();
  if(S.screen==='scan'){const c=el.querySelector('#scanqr'); if(c) drawQR(c, QR_SIZE, qrSeed());}
  document.getElementById('scenarios').innerHTML = Object.entries(SCENARIOS).map(([k,v])=>
    `<button class="${S.scenario===k?'on':''}" title="${v.desc}" onclick="reset('${k}')">${v.label}</button>`).join('');
  if(S.modal) document.querySelector('.modal').scrollIntoView({block:'nearest'});
}
/* thu nhỏ khu thiết bị cho vừa một màn hình khi trình chiếu */
function fit(){
  const st=document.getElementById('stage'); st.style.zoom=1;
  if(innerWidth<=900) return;
  const top=st.getBoundingClientRect().top+scrollY;
  st.style.zoom=Math.max(.6, Math.min(1, (innerHeight-top-20)/st.offsetHeight));
}
addEventListener('resize', fit);
reset('full'); fit();
</script>
